<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自在江湖 · 角色</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="game-shell" aria-labelledby="title">
    <header><p class="eyebrow">自在江湖</p><h1 id="title">创建角色</h1></header>
    <section id="portrait-area" class="portrait-area" aria-label="角色选择">
      <div class="character-mark" id="character-mark" aria-hidden="true">侠</div>
      <p id="appearance-caption">选择角色</p>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">正在读取角色……</p>
    <section id="appearance-step" hidden aria-labelledby="appearance-title">
      <h2 id="appearance-title">选择性别</h2>
      <div id="appearance-options" class="options" role="group" aria-label="性别"></div>
      <button id="next-button" class="primary" type="button" disabled>下一步</button>
    </section>
    <form id="name-step" hidden>
      <label for="character-name">角色名称</label>
      <input id="character-name" name="name" type="text" autocomplete="off" placeholder="输入角色名称">
      <div class="actions"><button id="back-button" class="secondary" type="button">返回</button><button id="save-button" class="primary" type="submit">保存角色</button></div>
    </form>
    <section id="jianghu-panel" hidden aria-label="江湖">
      <div class="jianghu-identity"><strong id="jianghu-name"></strong><span id="jianghu-appearance"></span></div>
      <div class="jianghu-space" aria-hidden="true"><span>江湖</span></div>
      <p id="checkpoint-message" class="status" role="status"></p>
      <button id="retry-checkpoint" class="secondary" type="button" hidden>重新读取武学</button>
      <nav class="jianghu-navigation" aria-label="江湖导航"><button id="open-character" class="secondary" type="button">侠客</button><button id="open-equipment" class="primary" type="button" hidden>武学</button></nav>
    </section>
    <section id="saved-step" hidden aria-labelledby="saved-title">
      <h2 id="saved-title">我的角色</h2>
      <dl><div><dt>角色名称</dt><dd id="saved-name"></dd></div><div><dt>性别</dt><dd id="saved-appearance"></dd></div></dl><button id="open-realm" class="primary" type="button" hidden>境界</button><p id="realm-entry-message" class="status" role="status"></p><button id="retry-realm-entry" class="secondary" type="button" hidden>重新读取境界</button><button id="open-martial" class="primary" type="button">武学图鉴</button><button id="back-jianghu" class="secondary" type="button">返回江湖</button>
    </section>
    <section id="realm-panel" hidden aria-labelledby="realm-name">
      <p id="realm-resource"></p>
      <div class="realm-seat" aria-hidden="true">修炼</div>
      <h2 id="realm-name"></h2>
      <p id="realm-progress"></p>
      <dl id="realm-attributes"></dl>
      <div id="realm-training" class="realm-training"></div>
      <p id="realm-task" class="equipment-task"></p>
      <p id="realm-message" class="status" role="status" aria-live="polite"></p>
      <button id="retry-realm" class="secondary" type="button" hidden>重新读取境界</button>
      <button id="back-realm" class="secondary" type="button">返回角色</button>
    </section>
    <section id="equipment-panel" hidden aria-labelledby="equipment-title">
      <div class="equipment-heading"><h2 id="equipment-title">武学</h2><button id="edit-equipment" class="secondary" type="button" aria-pressed="false">编辑</button></div>
      <ol id="equipment-slots" class="equipment-slots" aria-label="武学槽位"></ol>
      <p id="equipment-edit-hint" class="reference-note" hidden>点击槽位右上角可卸下武学</p><h3>已拥有</h3>
      <div id="equipment-owned" class="equipment-owned"></div>
      <p id="equipment-task" class="equipment-task" aria-live="polite"></p>
      <button id="auto-equip" class="primary" type="button">一键装配</button>
      <button id="retry-equipment" class="secondary" type="button" hidden>重新读取</button>
      <button id="back-equipment" class="secondary" type="button">返回江湖</button>
    </section>
    <section id="martial-list" hidden aria-labelledby="martial-list-title">
      <h2 id="martial-list-title">武学图鉴</h2>
      <p class="reference-note">参考资料 · 只读</p>
      <div id="martial-entries" class="martial-entries"></div>
      <button id="retry-martial" class="secondary" type="button" hidden>重新读取图鉴</button>
      <button id="back-character" class="secondary" type="button">返回角色</button>
    </section>
    <section id="martial-detail" hidden aria-labelledby="martial-detail-title">
      <h2 id="martial-detail-title"></h2>
      <p class="reference-note">参考资料 · 只读</p>
      <dl id="martial-facts"></dl>
      <h3>技能说明</h3><ul id="martial-description"></ul>
      <p id="description-incomplete" class="reference-note" hidden>说明未完整收录</p>
      <h3>属性</h3><dl id="martial-attributes"></dl>
      <h3>天赋记录</h3><ul id="martial-talents"></ul>
      <button id="back-martial-list" class="secondary" type="button">返回图鉴</button>
    </section>
    <button id="retry-button" class="secondary" type="button" hidden>重新读取</button>
  </main>
</body>
</html>
